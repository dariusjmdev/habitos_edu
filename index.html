<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HábitoTracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>HábitoTracker</h1>
  </header>

  <main>
    <section class="tarjeta">
  <h2>Nuevo hábito</h2>
  <form id="form-habito">
    <label>Nombre
      <input type="text" id="h-nombre" placeholder="Ej: Leer 20 minutos">
    </label>
    <label>Descripción
      <textarea id="h-descripcion" rows="2"></textarea>
    </label>
    <label>Categoría
      <select id="h-categoria">
        <option>Salud</option>
        <option>Estudio</option>
        <option>Ocio</option>
        <option>Trabajo</option>
        <option>Otros</option>
      </select>
    </label>
    <p id="h-mensaje" class="mensaje"></p>
    <button type="submit">Crear</button>
  </form>
</section>
<section class="tarjeta">
  <h2>Registrar día</h2>
  <form id="form-registro">
    <label>Hábito
      <select id="r-habito"></select>
    </label>
    <label>Fecha
      <input type="date" id="r-fecha">
    </label>
    <label>Observaciones
      <textarea id="r-observaciones" rows="2"></textarea>
    </label>
    <label class="check">
      <input type="checkbox" id="r-cumplido"> Cumplido
    </label>
    <p id="r-mensaje" class="mensaje"></p>
    <button type="submit">Guardar registro</button>
  </form>
</section>
  </main>

  <script src="app.js"></script>
</body>
</html>

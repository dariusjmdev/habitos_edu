<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HábitoTracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>HábitoTracker</h1>
    <nav id="menu">
        <a href="#" id="enlace-inicio">Inicio</a>
        <a href="#" id="enlace-seguimiento">Ver seguimiento</a>
    </nav>
  </header>

  <main>
    <section class="tarjeta">
  <h2>Nuevo hábito</h2>
  <form id="form-habito">
    <label>Nombre
      <input type="text" id="h-nombre" placeholder="Ej: Leer 20 minutos">
    </label>
    <label>Descripción
      <textarea id="h-descripcion" rows="2"></textarea>
    </label>
    <label>Categoría
      <select id="h-categoria">
        <option>Salud</option>
        <option>Estudio</option>
        <option>Ocio</option>
        <option>Trabajo</option>
        <option>Otros</option>
      </select>
    </label>
    <p id="h-mensaje" class="mensaje"></p>
    <button type="submit">Crear</button>
  </form>
</section>
<section class="tarjeta">
  <h2>Registrar día</h2>
  <form id="form-registro">
    <label>Hábito
      <select id="r-habito"></select>
    </label>
    <label>Fecha
      <input type="date" id="r-fecha">
    </label>
    <label>Observaciones
      <textarea id="r-observaciones" rows="2"></textarea>
    </label>
    <label class="check">
      <input type="checkbox" id="r-cumplido"> Cumplido
    </label>
    <p id="r-mensaje" class="mensaje"></p>
    <button type="submit">Guardar registro</button>
  </form>
</section>
  </main>
<div id="modal" class="modal oculto">
  <div class="modal-caja">
    <div class="modal-cabecera">
      <h2>Seguimiento</h2>
      <button id="cerrar-modal" aria-label="Cerrar">✕</button>
    </div>
    <p id="resumen"></p>
    <table>
      <thead>
        <tr>
          <th>Hábito</th>
          <th>Fecha</th>
          <th>Observaciones</th>
          <th>Estado</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="tabla-body"></tbody>
    </table>
  </div>
</div>
  <script src="app.js"></script>
</body>
</html>
